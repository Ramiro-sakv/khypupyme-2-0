name: Revisar KhypuPyme

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Compilación, tipos y dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: web/package.json
      - name: Restaurar y auditar dependencias .NET
        run: dotnet restore KhypuPyme.slnx --locked-mode -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate
      - name: Compilar el servidor y generar OpenAPI
        run: dotnet build KhypuPyme.slnx -c Release --no-restore
      - name: Instalar y auditar dependencias web
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web audit --audit-level moderate
      - name: Verificar el contrato con React
        run: |
          pnpm --dir web generate:api
          git diff --exit-code -- web/src/api/schema.d.ts
      - name: Revisar el código y compilar React
        run: |
          pnpm --dir web lint
          pnpm --dir web build

  secrets:
    name: Revisar secretos en Git
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Escanear el historial con Gitleaks
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact --log-opts="--all" /repo
